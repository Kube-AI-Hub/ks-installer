{{- /*
Copyright 2026 Kube AI Hub.

MinIO StatefulSet. Standalone renders one replica with one volume; distributed
renders `replicas` servers, each with `volumesPerServer` drives, and passes the
full drive list to `minio server` so MinIO configures erasure coding itself.

Server names come from the headless Service, so the drive list is stable across
restarts: <fullname>-<i>.<headless>.<ns>.svc.<clusterDomain><mountPath>-<j>
*/ -}}
{{- $servers := int .Values.replicas -}}
{{- $vps := int (include "minio.volumesPerServer" .) -}}
{{- $headless := include "minio.headlessName" . -}}
{{- $fullname := include "minio.fullname" . -}}
{{- $mountPath := .Values.mountPath -}}
{{- $total := int (include "minio.totalDrives" .) -}}
{{- if eq .Values.mode "standalone" -}}
{{- /* Standalone is one server. It may still have several drives: a single-node
       multi-drive MinIO is valid erasure coding, and the default (1) keeps the
       legacy single-volume output unchanged. */ -}}
{{- $servers = 1 -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ include "minio.name" . }}
    chart: {{ include "minio.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  podManagementPolicy: Parallel
  serviceName: {{ $headless }}
  replicas: {{ $servers }}
  selector:
    matchLabels:
      app: {{ include "minio.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "minio.name" . }}
        release: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secrets: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{ toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "minio.serviceAccountName" . | quote }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "minio.imageRef" (dict "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ce
            - |
              exec /usr/bin/docker-entrypoint.sh minio -C {{ .Values.configPath }} server \
              {{- if eq .Values.mode "distributed" }}
              {{- range $i := until $servers }}
              {{- range $j := until $vps }}
                http://{{ $fullname }}-{{ $i }}.{{ $headless }}.{{ $.Release.Namespace }}.svc.{{ $.Values.clusterDomain }}{{ $mountPath }}-{{ $j }} \
              {{- end }}
              {{- end }}
              {{- else }}
                {{ $mountPath }} \
              {{- end }}
              {{- range .Values.extraArgs }}
                {{ . }} \
              {{- end }}
              ;
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            {{- range $j := until $vps }}
            - name: data-{{ $j }}
              mountPath: {{ $mountPath }}-{{ $j }}
            {{- end }}
            {{- end }}
            - name: minio-config-dir
              mountPath: {{ .Values.configPath }}
          ports:
            - name: service
              containerPort: 9000
            {{- if .Values.console.enabled }}
            - name: console
              containerPort: 9001
            {{- end }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" . }}
                  key: accesskey
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "minio.secretName" . }}
                  key: secretkey
          {{- if .Values.console.enabled }}
          args:
            - --console-address
            - ":9001"
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            {{- toYaml .Values.livenessProbe | nindent 12 }}
      volumes:
        - name: minio-config-dir
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.podAntiAffinity.enabled (gt $servers 1) }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: {{ include "minio.name" . }}
                  release: {{ .Release.Name }}
              topologyKey: {{ .Values.podAntiAffinity.topologyKey }}
        {{- with .Values.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- else }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    {{- range $j := until $vps }}
    - metadata:
        name: data-{{ $j }}
      spec:
        accessModes:
          - {{ $.Values.persistence.accessMode | quote }}
        {{- if $.Values.persistence.storageClass }}
        storageClassName: {{ $.Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.persistence.size | quote }}
    {{- end }}
  {{- end }}
