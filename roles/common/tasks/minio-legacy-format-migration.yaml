---
- name: KubeAIHub | Creating legacy migration manifests
  template:
    src: "{{ item.src }}"
    dest: "{{ kubesphere_dir }}/{{ item.dest }}"
  loop:
    - { src: minio-legacy-reader.yaml.j2, dest: minio-legacy-reader.yaml }
    - { src: minio-legacy-backup.yaml.j2, dest: minio-legacy-backup.yaml }
    - { src: minio-legacy-wipe.yaml.j2, dest: minio-legacy-wipe.yaml }
    - { src: minio-legacy-restore.yaml.j2, dest: minio-legacy-restore.yaml }

- name: KubeAIHub | Cleaning up previous legacy migration resources
  shell: >
    {{ bin_dir }}/kubectl delete job minio-legacy-backup minio-legacy-restore
    -n kubesphere-system --ignore-not-found &&
    {{ bin_dir }}/kubectl delete pod minio-legacy-reader minio-data-wipe
    -n kubesphere-system --ignore-not-found &&
    {{ bin_dir }}/kubectl delete svc minio-legacy-reader
    -n kubesphere-system --ignore-not-found &&
    {{ bin_dir }}/kubectl delete pvc minio-backup
    -n kubesphere-system --ignore-not-found
  failed_when: false

- name: KubeAIHub | Scaling down current MinIO deployment
  shell: >
    {{ bin_dir }}/kubectl scale deployment minio
    -n kubesphere-system --replicas=0 --timeout=120s &&
    {{ bin_dir }}/kubectl wait --for=delete pod
    -l app=minio -n kubesphere-system --timeout=300s
  register: minio_scale_down
  failed_when: false

- name: KubeAIHub | Starting legacy MinIO reader on existing PVC
  shell: >
    {{ bin_dir }}/kubectl apply -f {{ kubesphere_dir }}/minio-legacy-reader.yaml &&
    {{ bin_dir }}/kubectl wait --for=condition=ready pod/minio-legacy-reader
    -n kubesphere-system --timeout=600s
  register: minio_legacy_reader

- name: KubeAIHub | Backing up MinIO data before legacy format migration
  shell: >
    {{ bin_dir }}/kubectl apply -f {{ kubesphere_dir }}/minio-legacy-backup.yaml &&
    {{ bin_dir }}/kubectl wait --for=jsonpath='{.status.phase}'=Bound
    pvc/minio-backup -n kubesphere-system --timeout=300s &&
    {{ bin_dir }}/kubectl wait --for=condition=complete job/minio-legacy-backup
    -n kubesphere-system --timeout=1800s
  register: minio_backup_job
  when:
    - minio_legacy_reader.rc == 0

- name: KubeAIHub | Mark legacy migration backup completed
  set_fact:
    minio_legacy_migration: true
  when:
    - minio_backup_job is defined
    - minio_backup_job.rc == 0

- name: KubeAIHub | Abort when legacy migration backup failed
  fail:
    msg: >-
      MinIO legacy migration backup failed. Check logs with:
      kubectl logs -n kubesphere-system job/minio-legacy-backup
  when:
    - minio_legacy_migration is not defined or not minio_legacy_migration

- name: KubeAIHub | Removing legacy MinIO reader
  shell: >
    {{ bin_dir }}/kubectl delete pod minio-legacy-reader
    -n kubesphere-system --ignore-not-found &&
    {{ bin_dir }}/kubectl delete svc minio-legacy-reader
    -n kubesphere-system --ignore-not-found
  failed_when: false

- name: KubeAIHub | Wiping legacy MinIO volume metadata
  shell: >
    {{ bin_dir }}/kubectl delete pod minio-data-wipe
    -n kubesphere-system --ignore-not-found &&
    {{ bin_dir }}/kubectl apply -f {{ kubesphere_dir }}/minio-legacy-wipe.yaml &&
    {{ bin_dir }}/kubectl wait --for=jsonpath='{.status.phase}'=Succeeded
    pod/minio-data-wipe -n kubesphere-system --timeout=300s
  when:
    - minio_legacy_migration is defined
    - minio_legacy_migration

- name: KubeAIHub | Removing legacy migration helper pod
  shell: >
    {{ bin_dir }}/kubectl delete pod minio-data-wipe
    -n kubesphere-system --ignore-not-found
  failed_when: false
  when:
    - minio_legacy_migration is defined
    - minio_legacy_migration

- name: KubeAIHub | Reset MinIO deployment replicas after legacy migration
  shell: >
    {{ bin_dir }}/kubectl patch deployment minio
    -n kubesphere-system --type merge
    -p '{"spec":{"replicas":1}}'
  when:
    - minio_legacy_migration is defined
    - minio_legacy_migration

- name: KubeAIHub | Cleaning up stuck MinIO bucket job before helm upgrade
  shell: >
    {{ bin_dir }}/kubectl delete job minio-make-bucket-job
    -n kubesphere-system --ignore-not-found
  failed_when: false
  when:
    - minio_legacy_migration is defined
    - minio_legacy_migration
