- name: KubeAIHub | Getting minio installation files
  copy:
    src: "{{ item }}"
    dest: "{{ kubesphere_dir }}/"
  loop:
    - "minio-ha"


- name: KubeAIHub | Creating manifests
  template:
    src: "{{ item.file }}.j2"
    dest: "{{ kubesphere_dir }}/{{ item.file }}"
  with_items:
    - { name: custom-values-minio, file: custom-values-minio.yaml }


- name: KubeAIHub | Checking minio
  shell: >
    {{ bin_dir }}/helm list -a -n kubesphere-system | grep "ks-minio"
  register: minio_check
  failed_when: false


- name: KubeAIHub | Checking MinIO pod readiness for target release
  # Do not `| while; exit` — the exit only ends the pipe subshell, so a trailing
  # `echo false` always ran and made a Ready 2025 pod look unready.
  shell: |
    out="$({{ bin_dir }}/kubectl get pod -n kubesphere-system -l app=minio -o jsonpath='{range .items[*]}{.spec.containers[0].image}{" "}{.status.containerStatuses[0].ready}{"\n"}{end}')"
    echo "$out" | grep -F "{{ minio_tag }}" | awk '{print $NF}' | grep -qx true && echo true || echo false
  register: minio_pod_ready_check
  failed_when: false
  changed_when: false


- name: KubeAIHub | Checking current MinIO Deployment image
  shell: >
    {{ bin_dir }}/kubectl get deploy minio -n kubesphere-system
    -o jsonpath='{.spec.template.spec.containers[0].image}'
  register: minio_deploy_image
  failed_when: false
  changed_when: false


- name: KubeAIHub | Checking if legacy MinIO format migration is needed
  set_fact:
    # FS→XL backup is only valid for MinIO RELEASE.2019 (format.json type=fs).
    # Pod not Ready / registry mismatch / helm pending must not trigger it:
    # a 2019 reader on an xl-single volume crashes, then mc mirror hangs until
    # the 1800s wait times out and leaves Deployment minio at 0 replicas.
    minio_needs_legacy_migration: >-
      {{
        minio_check.stdout.find("ks-minio") != -1 and (
          minio_check.stdout.find("RELEASE.2019") != -1 or
          (minio_deploy_image.stdout | default('') | trim).find("RELEASE.2019") != -1
        )
      }}
    minio_upgrade_required: >-
      {{
        minio_check.stdout.find("ks-minio") == -1 or
        minio_check.stdout.find(minio_tag) == -1 or
        minio_check.stdout.find("pending-upgrade") != -1 or
        minio_check.stdout.find("failed") != -1 or
        (
          minio_check.stdout.find("ks-minio") != -1 and
          (minio_pod_ready_check.stdout | default('false') | trim) != "true"
        )
      }}


- block:
    - name: KubeAIHub | Clearing leftover MinIO legacy-migration helpers
      shell: >
        {{ bin_dir }}/kubectl delete job minio-legacy-backup minio-legacy-restore
        -n kubesphere-system --ignore-not-found &&
        {{ bin_dir }}/kubectl delete pod minio-legacy-reader minio-data-wipe
        -n kubesphere-system --ignore-not-found &&
        {{ bin_dir }}/kubectl delete svc minio-legacy-reader
        -n kubesphere-system --ignore-not-found
      failed_when: false

    - name: KubeAIHub | Migrating legacy MinIO backend format before upgrade
      include_tasks: minio-legacy-format-migration.yaml
      when: minio_needs_legacy_migration | bool

    - name: KubeAIHub | Abort MinIO upgrade when legacy migration did not complete
      fail:
        msg: >-
          MinIO legacy format migration did not complete.
          Check: kubectl logs -n kubesphere-system job/minio-legacy-backup;
          kubectl logs -n kubesphere-system pod/minio-legacy-reader
      when:
        - minio_needs_legacy_migration | bool
        - not minio_legacy_migration | default(false) | bool
        - not minio_volume_already_xl | default(false) | bool

    - name: KubeAIHub | Deploying minio
      shell: >
        {{ bin_dir }}/kubectl delete job minio-make-bucket-job
        -n kubesphere-system --ignore-not-found &&
        {{ bin_dir }}/helm upgrade --install ks-minio
        {{ kubesphere_dir }}/minio-ha
        -f {{ kubesphere_dir }}/custom-values-minio.yaml
        --set fullnameOverride=minio
        --namespace kubesphere-system
        --wait --timeout 1800s
      register: minio_status
      failed_when: false

    - name: KubeAIHub | Restoring MinIO data after legacy format migration
      include_tasks: minio-legacy-restore.yaml
      when:
        - minio_legacy_migration | default(false) | bool
        - minio_status.rc == 0


    - debug:
        msg:
         - 1. check the storage configuration and storage server
         - 2. make sure the DNS address in /etc/resolv.conf is available
         - 3. execute 'kubectl logs -n kubesphere-system -l job-name=minio-make-bucket-job' to watch logs
         - 4. execute 'helm -n kubesphere-system uninstall ks-minio && kubectl -n kubesphere-system delete job minio-make-bucket-job'
         - 5. Restart the installer pod in kubesphere-system namespace
         - 6. for legacy migration issues, check 'kubectl logs -n kubesphere-system job/minio-legacy-backup'
      when:
        - minio_status.rc != 0


    - fail:
        msg: "It is suggested to refer to the above methods for troubleshooting problems ."
      when: minio_status.rc != 0
  when: minio_upgrade_required | bool


- name: KubeAIHub | Importing minio status
  shell: >
    {{ bin_dir }}/kubectl patch cc ks-installer
    --type merge
    -p '{"status": {"minio": {"status": "enabled", "enabledTime": "{{ lookup('pipe','date  +%Y-%m-%dT%H:%M:%S%Z') }}"}}}'
    -n kubesphere-system
  register: cc_result
  failed_when: "cc_result.stderr and 'Warning' not in cc_result.stderr"
  until: cc_result is succeeded
  retries: 5
  delay: 3
