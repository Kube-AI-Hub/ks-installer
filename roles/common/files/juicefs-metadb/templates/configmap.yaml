{{- /*
Copyright 2026 Kube AI Hub.

Runtime configuration.

The image's own config is included first so that the parameters below always
win. Order matters for listen_addresses in particular: included last, a
data-directory config that sets `listen_addresses = 'localhost'` would override
it, the port would only accept localhost connections, and the CSI driver would be
refused by the Service while the probes failed against the pod IP.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "juicefs-metadb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "juicefs-metadb.labels" . | nindent 4 }}
data:
  runtime.conf: |
    include_if_exists = '/var/lib/postgresql/data/postgresql.conf'
    include_if_exists = '/var/lib/postgresql/data/pgdata/postgresql.conf'
    {{- range $key, $value := .Values.parameters }}
    {{ printf "%s = %s" $key (toString $value | squote) }}
    {{- end }}
