{{- /*
Copyright 2026 Kube AI Hub.

Superuser password. Skipped when the operator manages the Secret themselves.
*/ -}}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "juicefs-metadb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "juicefs-metadb.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: the same password is referenced by the CSI driver
    # Secret, and losing it would strand every JuiceFS volume.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.auth.username | quote }}
  POSTGRES_PASSWORD: {{ include "juicefs-metadb.password" . | quote }}
  POSTGRES_MULTIPLE_DATABASES: {{ join "," .Values.databases | quote }}
  POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
{{- end }}
