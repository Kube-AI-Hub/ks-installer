apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "openldap-ha.fullname" . }}-test-connection"
  labels:
{{ include "openldap-ha.labels" . | indent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: {{ busybox_repo }}:{{ busybox_tag }}
      command: ['wget']
      args:  ['{{ include "openldap-ha.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
