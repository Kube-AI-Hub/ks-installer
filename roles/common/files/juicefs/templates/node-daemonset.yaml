{{- /*
Copyright 2026 Kube AI Hub.

CSI node plugin.

The workload is named ...-csi-node on purpose: the driver picks its role from the
POD_NAME environment variable and only starts the node plugin when the pod name
contains "csi-node". See the controller template for the full explanation.

Runs on every node because a volume can be mounted anywhere: JuiceFS is a
network filesystem, so any node can serve it. The privileged security context and
the bidirectional mount propagation on the pod directory are what let the plugin
bind a mount inside a pod's namespace on the host.

The toleration is `Exists` rather than the storage taint: the storage nodes need
the plugin as much as the workloads do.
*/ -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "juicefs.fullname" . }}-csi-node
  namespace: {{ include "juicefs.namespace" . }}
  labels:
    {{- include "juicefs.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "juicefs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/role: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 2
  template:
    metadata:
      labels:
        {{- include "juicefs.labels" . | nindent 8 }}
        app.kubernetes.io/role: node
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "juicefs.fullname" . }}-csi-node
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: juicefs-plugin
          image: {{ include "juicefs.imageRef" (dict "ctx" . "image" .Values.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --logtostderr
            - --nodeid=$(NODE_NAME)
            - --v={{ .Values.driverOptions.logLevel }}
            {{- range .Values.nodeExtraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: CSI_ENDPOINT
              value: unix://csi/csi.sock
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: JUICEFS_MOUNT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: KUBELET_PORT
              value: {{ .Values.node.kubeletPort | quote }}
            # The driver overwrites its built-in mount and config paths with these
            # unconditionally, so an unset value leaves the mount pod's jfs-dir
            # volume without a path and the API server rejects it.
            - name: JUICEFS_MOUNT_PATH
              value: {{ .Values.node.mountPath | quote }}
            - name: JUICEFS_CONFIG_PATH
              value: {{ .Values.node.configPath | quote }}
            - name: JUICEFS_MOUNT_IMAGE
              value: {{ include "juicefs.imageRef" (dict "ctx" . "image" .Values.mountImage) | quote }}
            # One mount pod per node instead of one per volume. The driver then
            # keys the mount by StorageClass name, so every volume from this
            # class shares a single juicefs client and, more importantly, a
            # single block cache: a model downloaded for one deploy is already
            # on disk for the next one on the same node.
            #
            # The StorageClass must not use templated secret names for this to be
            # accepted; ours are plain names.
            - name: STORAGE_CLASS_SHARE_MOUNT
              value: "true"
          securityContext:
            privileged: true
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # kubelet-dir must be the kubelet ROOT directory and must be named
            # exactly that: the driver looks up the volume by name to learn which
            # kubelet root directory the container has mounted, and compares it
            # with the /pods/<uid> path NodePublishVolume is asked to mount. A
            # differently named volume leaves the driver on its /var/lib/kubelet
            # default, and every mount then fails with a root-dir mismatch.
            - name: kubelet-dir
              mountPath: {{ .Values.node.kubeletDir }}
              mountPropagation: Bidirectional
            - name: jfs-dir
              mountPath: /jfs
              mountPropagation: Bidirectional
            - name: config-dir
              mountPath: /var/lib/juicefs/config
            - name: device-dir
              mountPath: /dev
            - name: update-conf-dir
              mountPath: /etc/juicefs
        - name: node-driver-registrar
          image: {{ include "juicefs.imageRef" (dict "ctx" . "image" .Values.sidecars.nodeDriverRegistrar) }}
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=$(ADDRESS)
            - --kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)
            - --v=5
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: DRIVER_REG_SOCK_PATH
              value: {{ .Values.node.kubeletDir }}/plugins/{{ include "juicefs.driverName" . }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # The registrar creates its own registration socket in /registration
            # by default, and that directory has to be kubelet's plugins_registry
            # for the kubelet to notice the plugin. Mounting the host directory
            # anywhere else makes the registrar fail to bind, which surfaces as
            # "bind: no such file or directory" and the plugin never registers.
            - name: registration-dir
              mountPath: /registration
        - name: liveness-probe
          image: {{ include "juicefs.imageRef" (dict "ctx" . "image" .Values.sidecars.livenessProbe) }}
          imagePullPolicy: IfNotPresent
          args:
            - --csi-address=$(ADDRESS)
            - --v=5
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins/{{ include "juicefs.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins_registry
            type: Directory
        # The whole kubelet root, not just pods: the driver reads this volume's
        # hostPath to decide where kubelet keeps its state.
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}
            type: Directory
        - name: jfs-dir
          hostPath:
            path: {{ .Values.node.mountPath }}
            type: DirectoryOrCreate
        - name: config-dir
          hostPath:
            path: {{ .Values.node.configPath }}
            type: DirectoryOrCreate
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
        - name: update-conf-dir
          hostPath:
            path: {{ .Values.node.updateConfDir }}
            type: DirectoryOrCreate
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
