{{- include "juicefs.validate" . -}}
{{- /*
Copyright 2026 Kube AI Hub.

Volume credentials for dynamically provisioned volumes. Every volume is a
directory inside the configured bucket, so one Secret serves them all. The
StorageClass names this Secret explicitly for provisioning, node publishing and
expansion; a Secret the CSI sidecars cannot read fails at the first PVC.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "juicefs.secretName" . }}
  namespace: {{ include "juicefs.namespace" . }}
  labels:
    {{- include "juicefs.labels" . | nindent 4 }}
  annotations:
    # Referenced by the StorageClass, so deleting it with the release would break
    # every existing PVC.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  name: {{ .Values.volume.name | quote }}
  metaurl: {{ .Values.volume.metaurl | quote }}
  storage: {{ .Values.volume.storage | quote }}
  bucket: {{ .Values.volume.bucket | quote }}
  access-key: {{ .Values.volume.accessKey | quote }}
  secret-key: {{ .Values.volume.secretKey | quote }}
  {{- if .Values.volume.secure }}
  storage-options: "secure=true"
  {{- end }}
  {{- range $key, $value := .Values.volume.extra }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "juicefs.labels" . | nindent 4 }}
  {{- with .Values.storageClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
provisioner: {{ include "juicefs.driverName" . }}
reclaimPolicy: {{ .Values.storageClass.reclaimPolicy }}
volumeBindingMode: {{ .Values.storageClass.volumeBindingMode }}
allowVolumeExpansion: {{ .Values.storageClass.allowVolumeExpansion }}
# Mount options are copied into every dynamically provisioned PV, and the driver
# reads them back from there when it builds the mount pod. That is how the node
# local block cache is configured: cache-dir becomes a hostPath on the mount pod,
# and free-space-ratio stops the cache from filling the disk.
mountOptions:
  - {{ printf "cache-dir=%s" .Values.node.cacheDir | quote }}
  {{- with .Values.node.cacheSize }}
  - {{ printf "cache-size=%s" . | quote }}
  {{- end }}
  - {{ printf "free-space-ratio=%s" .Values.node.freeSpaceRatio | quote }}
  - {{ printf "cache-eviction=%s" .Values.node.cacheEviction | quote }}
parameters:
  csi.storage.k8s.io/provisioner-secret-name: {{ include "juicefs.secretName" . }}
  csi.storage.k8s.io/provisioner-secret-namespace: {{ include "juicefs.namespace" . }}
  csi.storage.k8s.io/node-publish-secret-name: {{ include "juicefs.secretName" . }}
  csi.storage.k8s.io/node-publish-secret-namespace: {{ include "juicefs.namespace" . }}
  csi.storage.k8s.io/controller-expand-secret-name: {{ include "juicefs.secretName" . }}
  csi.storage.k8s.io/controller-expand-secret-namespace: {{ include "juicefs.namespace" . }}
