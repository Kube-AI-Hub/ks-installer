# Copyright 2026 Kube AI Hub.
#
# Render tests for the JuiceFS CSI chart. The StorageClass name is load-bearing:
# csghub-server reads "shared" out of it to pick ReadWriteMany, so it is asserted
# explicitly rather than left to the default.
suite: Test JuiceFS CSI chart
templates:
  - secret.yaml
  - rbac.yaml
  - controller-statefulset.yaml
  - node-daemonset.yaml
  - static-pv.yaml
release:
  name: juicefs
  namespace: kubesphere-system
set:
  volume.metaurl: "postgres://juicefs:pw@juicefs-metadb.kubesphere-system.svc:5432/juicefs_meta"
  volume.bucket: "http://ks-minio.kubesphere-system.svc:9000/jfs"
  volume.accessKey: "ak"
  volume.secretKey: "sk"
tests:
  ## ------------------------------------------------------------------
  ## Volume credentials and StorageClass
  ## ------------------------------------------------------------------
  - it: renders the volume credentials in the keys juicefs expects
    template: secret.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: juicefs-secret
      - equal:
          path: stringData.name
          value: kubeaihub
      - equal:
          path: stringData.metaurl
          value: "postgres://juicefs:pw@juicefs-metadb.kubesphere-system.svc:5432/juicefs_meta"
      - equal:
          path: stringData.storage
          value: s3
      - equal:
          path: stringData.bucket
          value: "http://ks-minio.kubesphere-system.svc:9000/jfs"
      - equal:
          path: stringData["access-key"]
          value: ak
      - equal:
          path: stringData["secret-key"]
          value: sk
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: creates a shared StorageClass so csghub-server picks ReadWriteMany
    template: secret.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: kind
          value: StorageClass
      - matchRegex:
          path: metadata.name
          pattern: "shared"
      - equal:
          path: provisioner
          value: csi.juicefs.com
      - equal:
          path: reclaimPolicy
          value: Retain
      - equal:
          path: allowVolumeExpansion
          value: true
      - equal:
          path: volumeBindingMode
          value: Immediate

  - it: points the StorageClass at the volume Secret for every operation
    template: secret.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: parameters["csi.storage.k8s.io/provisioner-secret-name"]
          value: juicefs-secret
      - equal:
          path: parameters["csi.storage.k8s.io/provisioner-secret-namespace"]
          value: kubesphere-system
      - equal:
          path: parameters["csi.storage.k8s.io/node-publish-secret-name"]
          value: juicefs-secret
      - equal:
          path: parameters["csi.storage.k8s.io/controller-expand-secret-name"]
          value: juicefs-secret

  - it: names the StorageClass from values so a rename reaches the cluster
    template: secret.yaml
    documentIndex: 1
    set:
      storageClass.name: juicefs-shared-team
    asserts:
      - equal:
          path: metadata.name
          value: juicefs-shared-team

  ## ------------------------------------------------------------------
  ## Node local block cache
  ## ------------------------------------------------------------------
  - it: configures the node local block cache on the StorageClass
    template: secret.yaml
    documentIndex: 1
    asserts:
      # These land in every dynamically provisioned PV, and the driver reads them
      # back from there when it builds the mount pod.
      - contains:
          path: mountOptions
          content: "cache-dir=/data/juicefs-cache"
      - contains:
          path: mountOptions
          content: "free-space-ratio=0.1"
      - contains:
          path: mountOptions
          content: "cache-eviction=2-random"

  - it: moves the cache directory with the value, so a site can pick another disk
    template: secret.yaml
    documentIndex: 1
    set:
      node.cacheDir: /data1/juicefs-cache
    asserts:
      - contains:
          path: mountOptions
          content: "cache-dir=/data1/juicefs-cache"

  - it: omits cache-size by default so the JuiceFS default applies
    template: secret.yaml
    documentIndex: 1
    asserts:
      # cache-size=0 would disable the disk cache entirely, so an unset value must
      # render nothing at all rather than a zero.
      - notContains:
          path: mountOptions
          content: "cache-size=0"
      - notContains:
          path: mountOptions
          content: "cache-size=100G"

  - it: honours an explicit cache-size
    template: secret.yaml
    documentIndex: 1
    set:
      node.cacheSize: 500G
    asserts:
      - contains:
          path: mountOptions
          content: "cache-size=500G"

  - it: shares one mount pod per node so the block cache is shared too
    template: node-daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="STORAGE_CLASS_SHARE_MOUNT")].value
          value: "true"

  - it: passes the share switch to the controller, which reconciles mount pods
    template: controller-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="STORAGE_CLASS_SHARE_MOUNT")].value
          value: "true"

  - it: refuses a StorageClass name that would not select ReadWriteMany
    template: secret.yaml
    set:
      storageClass.name: local-static
    asserts:
      - failedTemplate:
          errorMessage: "storageClass.name \"local-static\" must contain \"shared\": csghub-server picks ReadWriteMany for classes whose name matches 'shared' and ReadWriteOnce for those matching 'local'."

  - it: refuses an empty metadata URL
    template: secret.yaml
    set:
      volume.metaurl: ""
    asserts:
      - failedTemplate: {}

  - it: refuses an empty bucket
    template: secret.yaml
    set:
      volume.bucket: ""
    asserts:
      - failedTemplate: {}

  ## ------------------------------------------------------------------
  ## CSIDriver
  ## ------------------------------------------------------------------
  - it: registers an attachless driver that cannot be attached to one node
    template: rbac.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: kind
          value: CSIDriver
      - equal:
          path: metadata.name
          value: csi.juicefs.com
      - equal:
          path: spec.attachRequired
          value: false
      - equal:
          path: spec.podInfoOnMount
          value: true

  ## ------------------------------------------------------------------
  ## Controller and node plugins
  ## ------------------------------------------------------------------
  - it: runs a single leader-elected controller
    template: controller-statefulset.yaml
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - lengthEqual:
          path: spec.template.spec.containers
          count: 4
      - equal:
          path: spec.template.spec.containers[0].name
          value: juicefs-plugin
      - equal:
          path: spec.template.spec.containers[1].name
          value: csi-provisioner

  - it: names the controller so the driver recognises its own role
    template: controller-statefulset.yaml
    asserts:
      # The driver reads POD_NAME and only starts the controller when the name
      # contains "csi-controller"; anything else starts, logs nothing, exits 0.
      - matchRegex:
          path: metadata.name
          pattern: "csi-controller$"

  - it: sets POD_NAME from the pod metadata, which is what the role check reads
    template: controller-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="POD_NAME")].valueFrom.fieldRef.fieldPath
          value: metadata.name

  - it: propagates mounts into the kubelet pod directory
    template: controller-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[4].mountPropagation
          value: Bidirectional

  - it: runs a node plugin on every node, including the tainted storage nodes
    template: node-daemonset.yaml
    asserts:
      - equal:
          path: kind
          value: DaemonSet
      - equal:
          path: spec.template.spec.containers[0].name
          value: juicefs-plugin
      - equal:
          path: spec.template.spec.containers[0].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.tolerations[0].operator
          value: Exists
      - equal:
          path: spec.template.spec.containers[2].name
          value: liveness-probe

  - it: exposes the kubelet root under the volume name the driver looks for
    template: node-daemonset.yaml
    asserts:
      # The driver reads this volume's hostPath to learn which kubelet root the
      # container mounted, and compares it with the path NodePublishVolume is
      # asked for. Renaming the volume or changing the hostPath makes every
      # mount fail with a root-dir mismatch.
      - equal:
          path: spec.template.spec.volumes[?(@.name=="kubelet-dir")].hostPath.path
          value: /var/lib/kubelet
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[?(@.name=="kubelet-dir")].mountPath
          value: /var/lib/kubelet

  - it: passes the mount and config paths the driver overwrites its defaults with
    template: node-daemonset.yaml
    asserts:
      # nodeRun assigns these straight from the environment over its built-in
      # defaults. Left unset, the mount pod is built with a jfs-dir volume that
      # has no path and the API server rejects it.
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="JUICEFS_MOUNT_PATH")].value
          value: /var/lib/juicefs/volume
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="JUICEFS_CONFIG_PATH")].value
          value: /var/lib/juicefs/config

  - it: names the node plugin so the driver recognises its own role
    template: node-daemonset.yaml
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: "csi-node$"

  ## ------------------------------------------------------------------
  ## RBAC
  ## ------------------------------------------------------------------
  - it: grants the node plugin the verbs it needs in the workload namespace
    template: rbac.yaml
    documentIndex: 5
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: juicefs-csi-node
      # The driver creates a per-volume Secret for the mount pod, patches the
      # workload pod, and writes a ConfigMap for the mount configuration.
      - contains:
          path: rules[?(@.resources[0]=="secrets")].verbs
          content: create
      - contains:
          path: rules[?(@.resources[0]=="pods")].verbs
          content: patch
      - contains:
          path: rules[?(@.resources[0]=="configmaps")].verbs
          content: create

  - it: registers the plugin with kubelet through the standard plugin registry
    template: node-daemonset.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: node-driver-registrar
      - equal:
          path: spec.template.spec.containers[1].env[1].value
          value: /var/lib/kubelet/plugins/csi.juicefs.com/csi.sock
      # The registrar binds its own socket in /registration, so the host's
      # plugins_registry has to be mounted exactly there.
      - equal:
          path: spec.template.spec.containers[1].volumeMounts[1].mountPath
          value: /registration
      - equal:
          path: spec.template.spec.volumes[1].hostPath.path
          value: /var/lib/kubelet/plugins_registry

  ## ------------------------------------------------------------------
  ## Static volumes: the model cache and the public model directory
  ## ------------------------------------------------------------------
  - it: declares the model cache at a path an operator can rely on
    template: static-pv.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: kubeaihub-model-cache
      # The subPath is the contract: it is what the host mount shows and what a
      # pod mounts, and it must not change when the claim is rebuilt.
      - equal:
          path: spec.csi.volumeAttributes.subPath
          value: model-cache
      - equal:
          path: spec.csi.volumeHandle
          value: kubeaihub-model-cache
      # Static volumes are never provisioned, but naming the class is what makes
      # the driver join that class's shared mount pod instead of starting one of
      # its own for this volume.
      - equal:
          path: spec.storageClassName
          value: juicefs-shared
      - equal:
          path: spec.accessModes[0]
          value: ReadWriteMany

  - it: retains the model cache so a deleted claim cannot delete the models
    template: static-pv.yaml
    documentIndex: 0
    asserts:
      # Delete would run DeleteVolume, which removes the directory and every
      # model in it.
      - equal:
          path: spec.persistentVolumeReclaimPolicy
          value: Retain
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: reserves the cache volume for the claim that will mount it
    template: static-pv.yaml
    documentIndex: 0
    asserts:
      # Without claimRef the volume sits Available and the binder hands it to
      # whichever ReadWriteMany claim asks first.
      - equal:
          path: spec.claimRef.namespace
          value: spaces
      - equal:
          path: spec.claimRef.name
          value: csghub-model-cache

  - it: gives the cache volume the same block cache as the StorageClass
    template: static-pv.yaml
    documentIndex: 0
    asserts:
      # The mount pod is keyed by the hash of these options: a volume that
      # disagrees with the class gets a second client and a second cache.
      - contains:
          path: spec.mountOptions
          content: "cache-dir=/data/juicefs-cache"
      - contains:
          path: spec.mountOptions
          content: "free-space-ratio=0.1"
      - contains:
          path: spec.mountOptions
          content: "cache-eviction=2-random"

  - it: points the public model volume inside the cache
    template: static-pv.yaml
    documentIndex: 1
    asserts:
      # public models are a directory inside the cache rather than a volume of
      # their own, so a deploy that mounts one reads what is already cached.
      - equal:
          path: metadata.name
          value: kubeaihub-public-models
      - equal:
          path: spec.csi.volumeAttributes.subPath
          value: model-cache/public
      - equal:
          path: spec.claimRef.namespace
          value: csghub
      - equal:
          path: spec.claimRef.name
          value: public-models

  - it: turns the capacity into the byte count the driver wants
    template: static-pv.yaml
    documentIndex: 0
    asserts:
      # The PV capacity is a quantity while csi.volumeAttributes.capacity is
      # plain bytes, and the driver parses the second as an integer.
      - equal:
          path: spec.csi.volumeAttributes.capacity
          value: "1099511627776"

  - it: moves the static paths with the values
    template: static-pv.yaml
    documentIndex: 0
    set:
      staticVolumes.kubeaihub-model-cache.subPath: models
    asserts:
      - equal:
          path: spec.csi.volumeAttributes.subPath
          value: models

  - it: refuses a static volume without a claim to reserve it for
    template: static-pv.yaml
    set:
      staticVolumes.kubeaihub-model-cache.claimName: ""
    asserts:
      - failedTemplate: {}

  - it: refuses a static volume without a subPath
    template: static-pv.yaml
    set:
      staticVolumes.kubeaihub-model-cache.subPath: ""
    asserts:
      - failedTemplate: {}
