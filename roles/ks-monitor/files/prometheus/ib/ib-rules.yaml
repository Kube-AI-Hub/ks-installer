apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cluster-ib-k8s-rules
  namespace: kubesphere-monitoring-system
spec:
  groups:
  # InfiniBand / RDMA aggregation.
  #
  # The node_infiniband_* family is per (node, device, port). It is the one
  # node-exporter family that does not ship a node label natively, so the
  # node-exporter ServiceMonitor copies the node name into one for these series
  # (see node-exporter-serviceMonitor.yaml). Everything below can therefore
  # group by (node) directly.
  #
  # Rules are scoped to Mellanox devices: the nodes also expose Broadcom bnxt_re
  # NICs whose RDMA counters stay empty, and including them would dilute the
  # port-health ratio and add ~200 permanently-zero series.
  - name: cluster-ib.rules
    interval: 1m
    rules:
    # Port health. A port is "up" when its logical state is Active (4).
    - record: node:ib_port_up:count
      expr: |
        count by (node) (node_infiniband_state_id{device=~"mlx5_.*"} == 4)
    - record: node:ib_port_total:count
      expr: |
        count by (node) (node_infiniband_state_id{device=~"mlx5_.*"})
    - record: node:ib_health:ratio
      expr: |
        node:ib_port_up:count / node:ib_port_total:count

    # Throughput. port_data_* is byte-denominated from node-exporter v1.10 on,
    # so a plain rate is correct.
    - record: node:ib_rx_bytes:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_port_data_received_bytes_total{device=~"mlx5_.*"}[5m]))
    - record: node:ib_tx_bytes:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_port_data_transmitted_bytes_total{device=~"mlx5_.*"}[5m]))

    # Errors and link health. link_error_recovery is included because a rising
    # rate there means the link is flapping even when it never fully went down.
    - record: node:ib_rx_errors:rate
      expr: |
        sum by (node, device, port) (
          rate(node_infiniband_symbol_error_total{device=~"mlx5_.*"}[5m])
          + rate(node_infiniband_port_errors_received_total{device=~"mlx5_.*"}[5m])
          + rate(node_infiniband_local_link_integrity_errors_total{device=~"mlx5_.*"}[5m])
          + rate(node_infiniband_link_error_recovery_total{device=~"mlx5_.*"}[5m])
        )
    - record: node:ib_link_downed:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_link_downed_total{device=~"mlx5_.*"}[5m]))
    - record: node:ib_discards:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_port_discards_transmitted_total{device=~"mlx5_.*"}[5m]))
    - record: node:ib_vl15_dropped:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_vl15_dropped_total{device=~"mlx5_.*"}[5m]))
    - record: node:ib_transmit_wait:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_port_transmit_wait_total{device=~"mlx5_.*"}[5m]))

    # Congestion signals: retransmits, out-of-sequence, DCQCN slow restart.
    - record: node:ib_retrans:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_roce_adp_retransmits_total{device=~"mlx5_.*"}[5m]))
    - record: node:ib_out_of_sequence:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_out_of_sequence_packets_received_total{device=~"mlx5_.*"}[5m]))
    - record: node:ib_slow_restart:rate
      expr: |
        sum by (node, device, port) (rate(node_infiniband_roce_slow_restart_total{device=~"mlx5_.*"}[5m]))

    # Node-level rollups for the node pages.
    - record: node:ib_rx_bytes:sum
      expr: sum by (node) (node:ib_rx_bytes:rate)
    - record: node:ib_tx_bytes:sum
      expr: sum by (node) (node:ib_tx_bytes:rate)
    - record: node:ib_rx_errors:sum
      expr: sum by (node) (node:ib_rx_errors:rate)
    - record: node:ib_link_downed:sum
      expr: sum by (node) (node:ib_link_downed:rate)
    - record: node:ib_retrans:sum
      expr: sum by (node) (node:ib_retrans:rate)
    - record: node:ib_link_speed:sum
      expr: |
        sum by (node) (node_infiniband_rate_bytes_per_second{device=~"mlx5_.*"})

    # Cluster rollups for the overview card.
    - record: cluster:ib_rx_bytes:sum
      expr: sum(node:ib_rx_bytes:rate)
    - record: cluster:ib_tx_bytes:sum
      expr: sum(node:ib_tx_bytes:rate)
    - record: cluster:ib_port_up:count
      expr: sum(node:ib_port_up:count)
    - record: cluster:ib_port_total:count
      expr: sum(node:ib_port_total:count)
    - record: cluster:ib_health:ratio
      expr: sum(node:ib_port_up:count) / sum(node:ib_port_total:count)
    - record: cluster:ib_rx_errors:sum
      expr: sum(node:ib_rx_errors:rate)
    - record: cluster:ib_retrans:sum
      expr: sum(node:ib_retrans:rate)
    - record: cluster:ib_link_downed:sum
      expr: sum(node:ib_link_downed:rate)
    - record: cluster:ib_link_speed:sum
      expr: sum(node:ib_link_speed:sum)
