apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/version: 1.3.1
  name: node-exporter
  namespace: kubesphere-monitoring-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: exporter
      app.kubernetes.io/name: node-exporter
      app.kubernetes.io/part-of: kube-prometheus
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: node-exporter
      labels:
        app.kubernetes.io/component: exporter
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/part-of: kube-prometheus
        app.kubernetes.io/version: 1.3.1
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/edge
                operator: DoesNotExist
      containers:
      - args:
        - --web.listen-address=127.0.0.1:9100
        - --path.sysfs=/host/sys
        - --path.rootfs=/host/root
        - --no-collector.wifi
        - --no-collector.hwmon
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/k3s/containerd/.+|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)
        - --collector.netclass.ignored-devices=^(veth.*|[a-f0-9]{15})$
        - --collector.netdev.device-exclude=^(veth.*|[a-f0-9]{15})$
        # The infiniband collector does not expose /ports/<n>/link_layer, so the
        # RDMA port list cannot tell InfiniBand from RoCE. The sidecar below writes
        # it as a textfile metric.
        - --collector.textfile.directory=/host/textfile
        image: prom/node-exporter:v1.12.1
        name: node-exporter
        resources:
          limits:
            cpu: 250m
            memory: 180Mi
          requests:
            cpu: 102m
            memory: 180Mi
        volumeMounts:
        - mountPath: /host/sys
          mountPropagation: HostToContainer
          name: sys
          readOnly: true
        - mountPath: /host/root
          mountPropagation: HostToContainer
          name: root
          readOnly: true
        - mountPath: /host/textfile
          name: textfile
      # Publishes node_rdma_link_layer from /sys/class/infiniband/<dev>/ports/<port>/link_layer.
      # A shell loop is used instead of a small Go program because it avoids shipping
      # and maintaining another image; the write is atomic so node-exporter never
      # reads a half-written file.
      #
      # The textfile directory is an emptyDir shared with node-exporter rather than
      # a hostPath: the pod runs as nobody (65534), so it cannot write a root-owned
      # host directory, and the file only needs to live as long as the pod.
      - args:
        - |
          set -eu
          OUT=/host/textfile/rdma_link_layer.prom
          TMP=/host/textfile/rdma_link_layer.prom.tmp
          while true; do
            {
              echo '# HELP node_rdma_link_layer InfiniBand port link layer (1=InfiniBand, 2=Ethernet/RoCE, 0=unknown).'
              echo '# TYPE node_rdma_link_layer gauge'
              for d in /host/sys/class/infiniband/*/ports/*; do
                [ -d "$d" ] || continue
                dev=$(basename "$(dirname "$(dirname "$d")")")
                port=$(basename "$d")
                ll=$(cat "$d/link_layer" 2>/dev/null || echo "")
                case "$ll" in
                  InfiniBand) v=1 ;;
                  Ethernet)   v=2 ;;
                  *)          v=0 ;;
                esac
                echo "node_rdma_link_layer{device=\"$dev\",port=\"$port\"} $v"
              done
            } > "$TMP"
            mv "$TMP" "$OUT"
            sleep 30
          done
        command:
        - /bin/sh
        - -c
        image: kube-ai-hub/busybox:latest
        name: rdma-link-layer
        resources:
          limits:
            cpu: 10m
            memory: 32Mi
          requests:
            cpu: 5m
            memory: 16Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /host/sys
          mountPropagation: HostToContainer
          name: sys
          readOnly: true
        - mountPath: /host/textfile
          name: textfile
      - args:
        - --logtostderr
        - --secure-listen-address=[$(IP)]:9100
        - --tls-cipher-suites=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - --upstream=http://127.0.0.1:9100/
        env:
        - name: IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: kube-ai-hub/kube-rbac-proxy:v0.14.0
        name: kube-rbac-proxy
        ports:
        - containerPort: 9100
          hostPort: 9100
          name: https
        resources:
          limits:
            cpu: 20m
            memory: 40Mi
          requests:
            cpu: 10m
            memory: 20Mi
        securityContext:
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
      hostNetwork: true
      hostPID: true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      serviceAccountName: node-exporter
      tolerations:
      - operator: Exists
      volumes:
      - hostPath:
          path: /sys
        name: sys
      - hostPath:
          path: /
        name: root
      # Shared between the textfile writer and node-exporter. emptyDir rather than
      # hostPath: the pod runs as nobody (65534) and cannot write a root-owned host
      # directory, and the file only needs to outlive the pod, not the node.
      - emptyDir: {}
        name: textfile
  updateStrategy:
    type: OnDelete
