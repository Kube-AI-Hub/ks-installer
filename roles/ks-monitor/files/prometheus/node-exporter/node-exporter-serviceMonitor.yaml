apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: exporter
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/part-of: kube-prometheus
    app.kubernetes.io/vendor: kubesphere
    app.kubernetes.io/version: 1.3.1
  name: node-exporter
  namespace: kubesphere-monitoring-system
spec:
  endpoints:
  - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    interval: 1m
    metricRelabelings:
    # Keep the existing whitelist, and drop the noisy InfiniBand counters rather
    # than extending the whitelist: node-exporter v1.12 exposes ~52 IB metrics and
    # the whitelist regex is already close to the length the scrape URL tolerates.
    - action: keep
      regex: node_(uname|network)_info|node_cpu_.+|node_memory_Mem.+_bytes|node_memory_SReclaimable_bytes|node_memory_Cached_bytes|node_memory_Buffers_bytes|node_network_(.+_bytes_total|up)|node_network_.+_errs_total|node_network_.+_packets_total|node_nf_conntrack_entries.*|node_disk_.+_completed_total|node_disk_.+_bytes_total|node_filesystem_files|node_filesystem_files_free|node_filesystem_avail_bytes|node_filesystem_size_bytes|node_filesystem_free_bytes|node_filesystem_readonly|node_load.+|node_timex_offset_seconds|node_timex_maxerror_seconds|node_timex_sync_status|node_time_seconds|node_filefd_allocated|node_filefd_maximum|node_md_disks|node_md_disks_required|node_textfile_scrape_error|node_infiniband_.+
      sourceLabels:
      - __name__
    - action: drop
      regex: node_infiniband_(duplicate_requests|implied_nak_seq_errors|local_ack_timeout_errors|lifespan_seconds|multicast_packets|out_of_buffer_drops|port_constraint_errors|port_packets|port_receive_(remote_physical|switch_relay)_errors|req_cqes|req_remote|resp_cqes|resp_local_length|resp_remote_access|rnr_nak_retry|roce_adp_retransmits_timeout|roce_slow_restart_(cnps|used)|rx_atomic|rx_dct|unicast_packets)
      sourceLabels:
      - __name__
    port: https
    relabelings:
    - action: replace
      regex: (.*)
      replacement: $1
      sourceLabels:
      - __meta_kubernetes_pod_node_name
      targetLabel: instance
    # The InfiniBand collector is the only one that does not carry a node label,
    # and kube-server selects node metrics by `node`. Copy it across for those
    # series so the RDMA ports API and the node dashboards can select them the
    # same way as every other node metric.
    - action: replace
      regex: (.*)
      replacement: $1
      sourceLabels:
      - __meta_kubernetes_pod_node_name
      targetLabel: node
    - action: labeldrop
      regex: (service|endpoint|container)
    scheme: https
    tlsConfig:
      insecureSkipVerify: true
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/component: exporter
      app.kubernetes.io/name: node-exporter
      app.kubernetes.io/part-of: kube-prometheus
