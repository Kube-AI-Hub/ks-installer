apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cluster-gpu-k8s-rules
  namespace: kubesphere-monitoring-system
spec:
  groups:
  # 通用 GPU 聚合规则 - 自动聚合所有 vendor
  - name: cluster-gpu.rules
    interval: 1m
    rules:
    # POD 级别 - GPU 使用量（from gpu-agent）
    - record: pod:gpu_usage:count
      expr: |
        sum by (namespace, pod, vendor) (gpu_agent_pod_utilisation / 100)
    
    # POD 级别 - GPU 显存使用量（from gpu-agent）
    - record: pod:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, pod, vendor) (gpu_agent_pod_memory_used_bytes)
    
    # POD 级别 - GPU 分配量（from gpu-agent）
    - record: pod:gpu_allocated:count
      expr: |
        sum by (namespace, pod, vendor) (gpu_agent_pod_gpu_allocation)
    
    # Namespace 级别 - GPU 使用量（聚合所有厂商）
    - record: namespace:gpu_usage:count
      expr: |
        sum by (namespace, vendor) (
          pod:gpu_usage:count
        )
    
    # Namespace 级别 - GPU 显存使用量（聚合所有厂商）
    - record: namespace:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, vendor) (
          pod:gpu_memory_usage:bytes
        )
    
    # Namespace 级别 - GPU 分配量（聚合所有厂商）
    - record: namespace:gpu_allocated:count
      expr: |
        sum by (namespace, vendor) (
          pod:gpu_allocated:count
        )
    
    # Workload 级别 - GPU 使用量（聚合所有厂商）
    - record: namespace:workload:gpu_usage:count
      expr: |
        sum by (namespace, owner_kind, owner_name, vendor) (
          pod:gpu_usage:count
          * on(namespace, pod) group_left(owner_kind, owner_name) kube_pod_owner
        )
    
    # Workload 级别 - GPU 显存使用量（聚合所有厂商）
    - record: namespace:workload:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_kind, owner_name, vendor) (
          pod:gpu_memory_usage:bytes
          * on(namespace, pod) group_left(owner_kind, owner_name) kube_pod_owner
        )
    
    # Workload 级别 - GPU 分配量（聚合所有厂商）
    - record: namespace:workload:gpu_allocated:count
      expr: |
        sum by (namespace, owner_kind, owner_name, vendor) (
          pod:gpu_allocated:count
          * on(namespace, pod) group_left(owner_kind, owner_name) kube_pod_owner
        )
    
    # Deployment 级别 - GPU 使用量
    - record: namespace:deployment:gpu_usage:count
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_usage:count{owner_kind="Deployment"}
        )
    
    # Deployment 级别 - GPU 显存使用量
    - record: namespace:deployment:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_memory_usage:bytes{owner_kind="Deployment"}
        )
    
    # Deployment 级别 - GPU 分配量
    - record: namespace:deployment:gpu_allocated:count
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_allocated:count{owner_kind="Deployment"}
        )
    
    # DaemonSet 级别 - GPU 使用量
    - record: namespace:daemonset:gpu_usage:count
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_usage:count{owner_kind="DaemonSet"}
        )
    
    # DaemonSet 级别 - GPU 显存使用量
    - record: namespace:daemonset:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_memory_usage:bytes{owner_kind="DaemonSet"}
        )
    
    # DaemonSet 级别 - GPU 分配量
    - record: namespace:daemonset:gpu_allocated:count
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_allocated:count{owner_kind="DaemonSet"}
        )
    
    # StatefulSet 级别 - GPU 使用量
    - record: namespace:statefulset:gpu_usage:count
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_usage:count{owner_kind="StatefulSet"}
        )
    
    # StatefulSet 级别 - GPU 显存使用量
    - record: namespace:statefulset:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_memory_usage:bytes{owner_kind="StatefulSet"}
        )
    
    # StatefulSet 级别 - GPU 分配量
    - record: namespace:statefulset:gpu_allocated:count
      expr: |
        sum by (namespace, owner_name, vendor) (
          namespace:workload:gpu_allocated:count{owner_kind="StatefulSet"}
        )
    
    # Workspace 级别 - GPU 使用量（聚合所有厂商）
    - record: workspace:gpu_usage:count
      expr: |
        sum by (workspace, vendor) (
          namespace:gpu_usage:count
          * on(namespace) group_left(workspace) kube_namespace_labels
        )
    
    # Workspace 级别 - GPU 显存使用量（聚合所有厂商）
    - record: workspace:gpu_memory_usage:bytes
      expr: |
        sum by (workspace, vendor) (
          namespace:gpu_memory_usage:bytes
          * on(namespace) group_left(workspace) kube_namespace_labels
        )
    
    # Workspace 级别 - GPU 分配量（聚合所有厂商）
    - record: workspace:gpu_allocated:count
      expr: |
        sum by (workspace, vendor) (
          namespace:gpu_allocated:count
          * on(namespace) group_left(workspace) kube_namespace_labels
        )
    
    # 节点级别 - GPU 使用量（from gpu-agent gpu_card_utilisation）
    - record: node:gpu_usage:count
      expr: |
        sum by (node, vendor) (gpu_card_utilisation / 100)
    
    # 节点级别 - GPU 总数（from gpu-agent）
    - record: node:gpu_total:count
      expr: |
        count by (node, vendor) (gpu_card_utilisation)
    
    # 节点级别 - GPU 显存使用量（from gpu-agent）
    - record: node:gpu_memory_usage:bytes
      expr: |
        sum by (node, vendor) (gpu_card_memory_used_bytes)
    
    # 节点级别 - GPU 显存总量（from gpu-agent）
    - record: node:gpu_memory_total:bytes
      expr: |
        sum by (node, vendor) (gpu_card_memory_total_bytes)
    
    # 节点级别 - GPU 分配量（from gpu-agent）
    # 依赖：HAMi gpu-agent 暴露的 gpu_agent_card_allocation_rate（每卡分配率 0~1，按 node/vendor 求和即已分配卡数）。
    # 若 node_gpu_allocated 为空，请依次检查：
    # 1) Prometheus 中是否有 gpu_agent_card_allocation_rate 序列（GPU 节点是否部署并运行 gpu-agent）；
    # 2) gpu-agent 的 ServiceMonitor 是否被 Prometheus 抓取；
    # 3) 本 PrometheusRule 是否已加载到集群使用的 Prometheus 实例。
    - record: node:gpu_allocated:count
      expr: |
        sum by (node, vendor) (gpu_agent_card_allocation_rate)
    
    # 节点级别 - GPU 分配率（from gpu-agent）
    - record: node:gpu_allocation_rate
      expr: |
        sum by (node, vendor) (gpu_agent_card_allocation_rate)
        / (count by (node, vendor) (gpu_card_utilisation) > 0)
    
    # 集群级别 - GPU 利用率（所有 vendor 的平均）
    - record: cluster:gpu_utilization:ratio
      expr: |
        (sum(node:gpu_usage:count) or vector(0)) / (sum(node:gpu_total:count) or vector(1))
    
    # 集群级别 - GPU 使用量（所有 vendor 的总和）
    - record: cluster:gpu_usage:count
      expr: |
        sum(node:gpu_usage:count) or vector(0)
    
    # 集群级别 - GPU 总数（所有 vendor 的总和）
    - record: cluster:gpu_total:count
      expr: |
        sum(node:gpu_total:count) or vector(0)
    
    # 集群级别 - GPU 显存使用量（所有 vendor 的总和）
    - record: cluster:gpu_memory_usage:bytes
      expr: |
        sum(node:gpu_memory_usage:bytes) or vector(0)
    
    # 集群级别 - GPU 显存总量（所有 vendor 的总和）
    - record: cluster:gpu_memory_total:bytes
      expr: |
        sum(node:gpu_memory_total:bytes) or vector(0)
    
    # 集群级别 - GPU 分配量（所有 vendor 的总和）
    - record: cluster:gpu_allocated:count
      expr: |
        sum(node:gpu_allocated:count) or vector(0)

    # 集群级别 - GPU 分配率
    - record: cluster:gpu_allocation_rate
      expr: |
        (sum(gpu_agent_card_allocation_rate) or vector(0))
        / (count(gpu_card_utilisation) or vector(1))
