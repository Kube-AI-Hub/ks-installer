apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: enflame-gcu-k8s-rules
  namespace: kubesphere-monitoring-system
spec:
  groups:
  # Enflame GCU Rules - 容器级别 GPU 分配量（节点级别指标由 cluster-gpu-rules 统一从 gpu-agent 聚合）
  - name: enflame-gcu.rules
    interval: 1m
    rules:
    # 容器级别 - GPU 分配量
    - record: container:gpu_allocated:count
      expr: |
        sum by (namespace, pod, container) (
          kube_pod_container_resource_requests{resource="enflame_com_gcu", unit="integer"}
          * on (namespace, pod) group_left() (kube_pod_status_phase{phase=~"Pending|Running"} > 0)
        )
      labels:
        vendor: enflame

