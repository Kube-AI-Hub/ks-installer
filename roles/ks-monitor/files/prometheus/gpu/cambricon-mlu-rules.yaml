apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cambricon-mlu-k8s-rules
  namespace: kubesphere-monitoring-system
spec:
  groups:
  # Cambricon MLU Rules - 容器级别 GPU 使用量/显存/分配量（节点级别指标由 cluster-gpu-rules 统一从 gpu-agent 聚合）
  - name: cambricon-mlu.rules
    interval: 1m
    rules:
    # 容器级别 - GPU 使用量（基于 podresources collector）
    # 通过 mlu_container 找到对应 MLU 设备的 mlu_utilization
    # 使用 node,mlu,uuid,vf 匹配，避免 dynamic-smlu 下不同卡有相同 (uuid,vf) 导致 duplicate series
    - record: container:gpu_usage:count
      expr: |
        sum by (namespace, pod, container) (
          (mlu_utilization / 100)
          * on(node, mlu, uuid, vf) group_right()
          mlu_container
        )
      labels:
        vendor: cambricon
    
    # 容器级别 - GPU 显存使用量
    # mlu_container 在 dynamic-smlu 下对同一实例会输出 vcore 和 vmemory 两条，需去重
    - record: container:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, pod, container) (
          label_replace(mlu_memory_used, "app_namespace", "$1", "namespace", "(.+)")
          * on(uuid) group_left(namespace, pod, container)
          label_replace(
            max by (namespace, pod, container, node, mlu, uuid, vf) (mlu_container),
            "app_namespace", "$1", "namespace", "(.+)"
          )
        )
      labels:
        vendor: cambricon

    # 容器级别 - GPU 分配量
    - record: container:gpu_allocated:count
      expr: |
        sum by (namespace, pod, container) (
          kube_pod_container_resource_requests{resource="cambricon_com_mlu", unit="integer"}
          * on (namespace, pod) group_left() (kube_pod_status_phase{phase=~"Pending|Running"} > 0)
        )
      labels:
        vendor: cambricon