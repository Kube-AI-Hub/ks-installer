apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: cambricon-mlu-k8s-rules
  namespace: kubesphere-monitoring-system
spec:
  groups:
  # Cambricon MLU Rules - 统一指标名称，添加 vendor="cambricon" 标签
  - name: cambricon-mlu.rules
    interval: 1m
    rules:
    # 节点级别 - GPU 使用量（基于利用率计算）
    # 注意：MLU 指标只有 node 标签，没有 Hostname 标签（与 node 重复）
    - record: node:gpu_usage:count
      expr: |
        label_replace(
          ((sum(mlu_utilization) by (node) or vector(0)) / 100),
          "vendor", "cambricon", "", ""
        )
      labels:
        vendor: cambricon
    
    # 节点级别 - GPU 显存使用量（统一名称，bytes，节点聚合）
    - record: node:gpu_memory_usage:bytes
      expr: |
        label_replace(
          (sum(mlu_memory_used) by (node) or vector(0)),
          "vendor", "cambricon", "", ""
        )
      labels:
        vendor: cambricon
    
    # 节点级别 - GPU 显存总量（统一名称，bytes，节点聚合）
    - record: node:gpu_memory_total:bytes
      expr: |
        label_replace(
          (sum(mlu_memory_total) by (node) or vector(0)),
          "vendor", "cambricon", "", ""
        )
      labels:
        vendor: cambricon
    
    # 节点级别 - GPU 总数（统一名称，按型号统计）
    - record: node:gpu_total:count
      expr: |
        label_replace(
          (count(mlu_utilization) by (node) or vector(0)),
          "vendor", "cambricon", "", ""
        )
      labels:
        vendor: cambricon
    
    # 节点级别 - Cambricon MLU 分配量（基于 kube-state-metrics）
    - record: node:gpu_allocated:count
      expr: |
        label_replace(
          (sum by (node) (
            kube_pod_container_resource_requests{resource="cambricon_com_mlu", unit="integer"}
            * on (namespace, pod, uid) group_left(node) (kube_pod_info{node!=""})
            * on (namespace, pod) group_left() (kube_pod_status_phase{phase=~"Pending|Running"} > 0)
          ) or vector(0)),
          "vendor", "cambricon", "", ""
        )
      labels:
        vendor: cambricon
    
    # 容器级别 - GPU 使用量（基于 podresources collector）
    - record: container:gpu_usage:count
      expr: |
        sum by (namespace, pod, container) (
          mlu_container * on(namespace, pod) group_left() (kube_pod_status_phase{phase="Running"} > 0)
        )
      labels:
        vendor: cambricon
    
    # 容器级别 - GPU 显存使用量
    - record: container:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, pod, container) (
          label_replace(
            mlu_memory_used, "app_namespace", "$1", "namespace", "(.+)"
          ) * on(uuid) group_left(namespace, pod, container) (
            label_replace(
              mlu_container * on(namespace, pod) group_left() (kube_pod_status_phase{phase="Running"} > 0),
              "app_namespace", "$1", "namespace", "(.+)"
            )
          )
        )
      labels:
        vendor: cambricon
    
    # POD 级别 - GPU 使用量
    - record: pod:gpu_usage:count
      expr: |
        sum by (namespace, pod) (
          container:gpu_usage:count{vendor="cambricon"}
        )
      labels:
        vendor: cambricon
    
    # POD 级别 - GPU 显存使用量
    - record: pod:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, pod) (
          container:gpu_memory_usage:bytes{vendor="cambricon"}
        )
      labels:
        vendor: cambricon
    
    # Namespace 级别 - GPU 使用量
    - record: namespace:gpu_usage:count
      expr: |
        sum by (namespace) (
          pod:gpu_usage:count{vendor="cambricon"}
        )
      labels:
        vendor: cambricon
    
    # Namespace 级别 - GPU 显存使用量
    - record: namespace:gpu_memory_usage:bytes
      expr: |
        sum by (namespace) (
          pod:gpu_memory_usage:bytes{vendor="cambricon"}
        )
      labels:
        vendor: cambricon
    
    # Workload 级别 - GPU 使用量
    - record: namespace:workload:gpu_usage:count
      expr: |
        sum by (namespace, owner_kind, owner_name) (
          pod:gpu_usage:count{vendor="cambricon"}
          * on(namespace, pod) group_left(owner_kind, owner_name) kube_pod_owner
        )
      labels:
        vendor: cambricon
    
    # Workload 级别 - GPU 显存使用量
    - record: namespace:workload:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_kind, owner_name) (
          pod:gpu_memory_usage:bytes{vendor="cambricon"}
          * on(namespace, pod) group_left(owner_kind, owner_name) kube_pod_owner
        )
      labels:
        vendor: cambricon
    
    # Deployment 级别 - GPU 使用量
    - record: namespace:deployment:gpu_usage:count
      expr: |
        sum by (namespace, owner_name) (
          namespace:workload:gpu_usage:count{vendor="cambricon", owner_kind="Deployment"}
        )
      labels:
        vendor: cambricon
    
    # Deployment 级别 - GPU 显存使用量
    - record: namespace:deployment:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_name) (
          namespace:workload:gpu_memory_usage:bytes{vendor="cambricon", owner_kind="Deployment"}
        )
      labels:
        vendor: cambricon
    
    # DaemonSet 级别 - GPU 使用量
    - record: namespace:daemonset:gpu_usage:count
      expr: |
        sum by (namespace, owner_name) (
          namespace:workload:gpu_usage:count{vendor="cambricon", owner_kind="DaemonSet"}
        )
      labels:
        vendor: cambricon
    
    # DaemonSet 级别 - GPU 显存使用量
    - record: namespace:daemonset:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_name) (
          namespace:workload:gpu_memory_usage:bytes{vendor="cambricon", owner_kind="DaemonSet"}
        )
      labels:
        vendor: cambricon
    
    # StatefulSet 级别 - GPU 使用量
    - record: namespace:statefulset:gpu_usage:count
      expr: |
        sum by (namespace, owner_name) (
          namespace:workload:gpu_usage:count{vendor="cambricon", owner_kind="StatefulSet"}
        )
      labels:
        vendor: cambricon
    
    # StatefulSet 级别 - GPU 显存使用量
    - record: namespace:statefulset:gpu_memory_usage:bytes
      expr: |
        sum by (namespace, owner_name) (
          namespace:workload:gpu_memory_usage:bytes{vendor="cambricon", owner_kind="StatefulSet"}
        )
      labels:
        vendor: cambricon

