apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: iluvatar-gpgpu-k8s-rules
  namespace: kubesphere-monitoring-system
spec:
  groups:
  # Iluvatar GPGPU Rules - 统一指标名称，添加 vendor="iluvatar" 标签，节点聚合
  - name: iluvatar-gpgpu.rules
    interval: 1m
    rules:
    # 节点级别 - GPU 使用量（基于利用率计算）
    - record: node:gpu_usage:count
      expr: |
        label_replace(
          ((sum(ix_gpu_utilization) by (node) or vector(0)) / 100),
          "vendor", "iluvatar", "", ""
        )
      labels:
        vendor: iluvatar
    
    # 节点级别 - GPU 显存使用量（统一名称，bytes，节点聚合）
    - record: node:gpu_memory_usage:bytes
      expr: |
        label_replace(
          (sum(ix_mem_used * 1024 * 1024) by (node) or vector(0)),
          "vendor", "iluvatar", "", ""
        )
      labels:
        vendor: iluvatar
    
    # 节点级别 - GPU 显存总量（统一名称，bytes，节点聚合）
    - record: node:gpu_memory_total:bytes
      expr: |
        label_replace(
          (sum(ix_mem_total * 1024 * 1024) by (node) or vector(0)),
          "vendor", "iluvatar", "", ""
        )
      labels:
        vendor: iluvatar
    
    # 节点级别 - GPU 总数（统一名称，按型号统计）
    - record: node:gpu_total:count
      expr: |
        label_replace(
          (count(ix_gpu_utilization) by (node) or vector(0)),
          "vendor", "iluvatar", "", ""
        )
      labels:
        vendor: iluvatar
    
    # 容器级别 - GPU 分配量
    - record: container:gpu_allocated:count
      expr: |
        sum by (namespace, pod, container) (
          kube_pod_container_resource_requests{resource="iluvatar_com_gpu", unit="integer"}
          * on (namespace, pod) group_left() (kube_pod_status_phase{phase=~"Pending|Running"} > 0)
        )
      labels:
        vendor: iluvatar

