apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/instance: k8s
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: kube-prometheus
    prometheus: k8s
    role: alert-rules
  name: gpu-k8s-rules
  namespace: kubesphere-monitoring-system
spec:
  groups:
  # NVIDIA GPU Rules - 统一指标名称，添加 vendor="nvidia" 标签
  - name: nvidia-gpu.rules
    interval: 1m
    rules:
    # 节点级别 - GPU 显存使用量（统一名称，bytes，节点聚合）
    - record: node:gpu_memory_usage:bytes
      expr: |
        label_replace(
          (sum(DCGM_FI_DEV_FB_USED * 1024 * 1024) by (node, Hostname) or vector(0)),
          "vendor", "nvidia", "", ""
        )
      labels:
        vendor: nvidia
    
    # 节点级别 - GPU 显存总量（统一名称，bytes，节点聚合）
    - record: node:gpu_memory_total:bytes
      expr: |
        label_replace(
          (sum(DCGM_FI_DEV_FB_TOTAL * 1024 * 1024) by (node, Hostname) or vector(0)),
          "vendor", "nvidia", "", ""
        )
      labels:
        vendor: nvidia
    
    # 节点级别 - GPU 总数（统一名称，节点聚合）
    - record: node:gpu_total:count
      expr: |
        label_replace(
          (count(DCGM_FI_DEV_GPU_UTIL) by (node, Hostname) or vector(0)),
          "vendor", "nvidia", "", ""
        )
      labels:
        vendor: nvidia
    
    # 节点级别 - NVIDIA GPU 使用量（基于利用率加和计算，节点聚合）
    - record: node:gpu_usage:count
      expr: |
        label_replace(
          ((sum(DCGM_FI_DEV_GPU_UTIL) by (node, Hostname) or vector(0)) / 100),
          "vendor", "nvidia", "", ""
        )
      labels:
        vendor: nvidia
    
    # 节点级别 - NVIDIA GPU 分配量（基于 kube-state-metrics）
    # 注意：kube-state-metrics 将资源名 nvidia.com/gpu 转换为 nvidia_com_gpu
    # 通过 kube_pod_info join 获取 node 标签
    - record: node:gpu_allocated:count
      expr: |
        label_replace(
          (sum by (node) (
            kube_pod_container_resource_requests{resource="nvidia_com_gpu", unit="integer"}
            * on (namespace, pod, uid) group_left(node) (kube_pod_info{node!=""})
            * on (namespace, pod) group_left() (kube_pod_status_phase{phase=~"Pending|Running"} > 0)
          ) or vector(0)),
          "vendor", "nvidia", "", ""
        )
      labels:
        vendor: nvidia

